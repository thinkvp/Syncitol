name: UXP CI

on:
  push:
    branches: [main]
    paths: ['uxp/**', '.github/workflows/uxp-ci.yml']
  pull_request:
    paths: ['uxp/**', '.github/workflows/uxp-ci.yml']

defaults:
  run:
    working-directory: uxp

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # setup-node caches npm automatically from v5 on. There are no
          # dependencies and no lockfile here, so that would only fail
          # looking for one.
          package-manager-cache: false
      - name: Syntax check
        run: npm run lint
      - name: Unit tests
        run: npm test

  # The macOS addon is otherwise only compiled when a release tag is pushed,
  # so a change to the native code could first fail mid-release. Compile it
  # on every push too (same steps as uxp-release.yml, nothing uploaded).
  build-addon-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install build tools
        run: brew install nasm pkg-config

      - name: Cache FFmpeg build
        id: cache-ffmpeg
        uses: actions/cache@v6
        with:
          path: uxp/ffmpeg-out
          key: ffmpeg-mac-static-${{ hashFiles('uxp/scripts/build-ffmpeg-mac.sh') }}

      - name: Build FFmpeg (static, audio-only)
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o ffmpeg.tar.xz https://ffmpeg.org/releases/ffmpeg-8.1.2.tar.xz
          tar xf ffmpeg.tar.xz
          FFMPEG_SRC_DIR="$PWD/ffmpeg-8.1.2" PREFIX_BASE="$PWD/ffmpeg-out" \
            bash scripts/build-ffmpeg-mac.sh universal

      - name: Compile macOS addon
        run: |
          cmake -S native -B native/build \
            -DFFMPEG_ROOT="$PWD/ffmpeg-out/universal" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build native/build
          lipo -info native/build/syncitol.uxpaddon

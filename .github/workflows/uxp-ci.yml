name: UXP CI

on:
  push:
    branches: [main]
    paths: ['uxp/**', '.github/workflows/uxp-ci.yml']
  pull_request:
    paths: ['uxp/**', '.github/workflows/uxp-ci.yml']

defaults:
  run:
    working-directory: uxp

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          # setup-node caches npm automatically from v5 on. There are no
          # dependencies and no lockfile here, so that would only fail
          # looking for one.
          package-manager-cache: false
      - name: Syntax check
        run: npm run lint
      - name: Unit tests
        run: npm test
